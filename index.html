<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arbeidsluke Bane</title><style>body{font-family:system-ui;margin:auto;max-width:900px;padding:24px;background:#f5f7f8}form,.card{background:white;padding:20px;border-radius:12px;margin-bottom:16px}label{display:block;margin-top:10px}input{width:100%;padding:10px;box-sizing:border-box}button{margin-top:16px;padding:12px 18px;background:#146c43;color:white;border:0;border-radius:8px}.warning{color:#8a4b00}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>Arbeidsluke Bane</h1><p class="warning">Planleggingsstøtte. Ikke godkjenning til arbeid i spor.</p><form id="f"><label>Banestrekning / lineId<input name="line_id" required></label><label>Fra km<input name="km_from" type="number" step="0.001" required></label><label>Til km<input name="km_to" type="number" step="0.001" required></label><label>Fra<input name="start" type="datetime-local" required></label><label>Til<input name="end" type="datetime-local" required></label><label>Sikkerhet før tog, min<input name="safety_before_minutes" type="number" value="10"></label><label>Sikkerhet etter tog, min<input name="safety_after_minutes" type="number" value="10"></label><label>Minste netto luke, min<input name="minimum_window_minutes" type="number" value="20"></label><button>Finn arbeidsluker</button></form><div class="card" id="out"></div><script>f.onsubmit=async e=>{e.preventDefault();out.textContent='Henter...';const d=Object.fromEntries(new FormData(f));['km_from','km_to'].forEach(k=>d[k]=+d[k]);['safety_before_minutes','safety_after_minutes','minimum_window_minutes'].forEach(k=>d[k]=+d[k]);const r=await fetch('/api/work-windows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok){out.textContent=j.detail||'Feil';return}out.innerHTML='<p>'+j.warning+'</p><table><tr><th>Fra</th><th>Til</th><th>Brutto</th><th>Netto</th></tr>'+j.windows.map(w=>`<tr><td>${new Date(w.start).toLocaleString('no-NO')}</td><td>${new Date(w.end).toLocaleString('no-NO')}</td><td>${w.gross_minutes} min</td><td><b>${w.net_minutes} min</b></td></tr>`).join('')+'</table>'}</script></body></html>
